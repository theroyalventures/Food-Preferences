
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Mom's Kitchen - Food Preferences</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #090817;
  --panel: #131127;
  --panel2: #1b1734;
  --purple: #8b5cf6;
  --purple2: #a78bfa;
  --cyan: #22d3ee;
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #f59e0b;
  --text: #f5f3ff;
  --muted: #a5a0bd;
  --border: rgba(167,139,250,.22);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  padding: 24px 14px;
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 12% 0%, rgba(91,33,182,.22), transparent 32%),
    radial-gradient(circle at 90% 100%, rgba(34,211,238,.08), transparent 30%),
    var(--bg);
  background-attachment: fixed;
}

.container {
  position: relative;
  z-index: 2;
  width: min(100%, 540px);
  margin: 0 auto;
  padding: 28px 26px 30px;
  background: linear-gradient(160deg, rgba(27,23,52,.98), rgba(19,17,39,.98));
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 18px 55px rgba(0,0,0,.38),
              0 0 35px rgba(139,92,246,.08);
  animation: fade .6s ease;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.logo {
  text-align: center;
  margin: 0 0 12px;
}

.logo img {
  width: 92px;
  max-width: 35%;
  height: auto;
  object-fit: contain;
}

h2 {
  text-align: center;
  margin: 4px 0 22px;
  color: var(--text);
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: .2px;
}

.progress-container {
  width: 100%;
  height: 9px;
  background: #0d0b1d;
  border: 1px solid rgba(167,139,250,.12);
  border-radius: 50px;
  margin: 15px 0 12px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--purple), var(--cyan));
  border-radius: 50px;
  transition: width .4s ease-in-out;
  box-shadow: 0 0 14px rgba(139,92,246,.4);
}

.progress-text {
  text-align: center;
  font-size: .82rem;
  color: var(--muted);
  margin-bottom: 24px;
}

.question {
  display: none;
}

.question.active {
  display: block;
  animation: fade .25s ease;
}

.question > label {
  display: block;
  margin: 0 0 9px;
  color: #ddd6fe;
  font-weight: 600;
  font-size: .93rem;
  line-height: 1.5;
}

input[type="text"],
input[type="tel"],
textarea {
  display: block;
  width: 100%;
  padding: 13px 14px;
  margin: 0 0 20px;
  color: var(--text);
  background: #0d0b1d;
  border: 1px solid #30294d;
  border-radius: 11px;
  font: inherit;
  font-size: .92rem;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}

input::placeholder,
textarea::placeholder {
  color: #77718f;
}

input:focus,
textarea:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px rgba(139,92,246,.15);
}

.options {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin: 12px 0 22px;
}

.options label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  margin: 0;
  color: #ddd6fe;
  background: rgba(13,11,29,.78);
  border: 1px solid #30294d;
  border-radius: 11px;
  cursor: pointer;
  transition: .2s ease;
}

.options label:hover {
  transform: translateY(-1px);
  border-color: var(--purple2);
  background: #211a3c;
}

.options input {
  display: none;
}

.options label span {
  flex: 1;
}

.options label:has(input:checked) {
  color: #fff;
  background: linear-gradient(
    110deg,
    rgba(139,92,246,.28),
    rgba(34,211,238,.10)
  );
  border-color: var(--purple2);
  box-shadow: 0 0 0 2px rgba(139,92,246,.10),
              0 8px 22px rgba(0,0,0,.18);
  font-weight: 600;
}

.btn-group {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 28px;
}

button {
  flex: 1;
  min-height: 46px;
  padding: 12px 18px;
  color: #fff;
  background: linear-gradient(135deg, var(--purple), #6541d9);
  border: 1px solid rgba(196,181,253,.18);
  border-radius: 11px;
  font: inherit;
  font-size: .92rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform .2s, filter .2s, box-shadow .2s;
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
  filter: brightness(1.12);
  box-shadow: 0 9px 24px rgba(139,92,246,.25);
}

button:disabled {
  color: #77718f;
  background: #28243a;
  border-color: #39334f;
  cursor: not-allowed;
  box-shadow: none;
}

textarea {
  resize: vertical;
}

#loadingOverlay {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  color: var(--text);
  background: rgba(9,8,23,.96);
  font-weight: 600;
  text-align: center;
}

#loadingOverlay p {
  margin-top: 16px;
  color: var(--muted);
  line-height: 1.6;
}

.loader {
  width: 46px;
  height: 46px;
  border: 4px solid rgba(167,139,250,.2);
  border-top: 4px solid var(--cyan);
  border-right: 4px solid var(--purple);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (max-width: 520px) {
  body {
    padding: 14px 10px;
  }

  .container {
    padding: 22px 17px 24px;
    border-radius: 16px;
  }

  h2 {
    font-size: 1.25rem;
  }

  .btn-group {
    gap: 10px;
  }
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loadingOverlay">
  <div class="loader"></div>
  <p>
    Submitting your details<br>
    Generating your offer…
  </p>
</div>

<div class="container">

  <div class="logo">
    <img src="assets/26a0a991-6a84-43b9-8fa3-2f54275942b1_20250611_223104_0000.png" alt="Logo">
  </div>

  <h2>Food Preferences Survey</h2>

  <div class="progress-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div class="progress-text" id="progress-text"></div>

  <form id="survey-form">

    <!-- QUESTION 1 -->
    <div class="question active">
      <label>Full Name</label>
      <input type="text" name="name" required placeholder="Your name">

      <label>Phone Number</label>
      <input type="tel" name="tel" required placeholder="Phone number">

      <label>Building & Floor</label>
      <input type="text" name="address" required placeholder="E.g., A-53, 2nd Floor, FIEE Complex">
    </div>

    <!-- QUESTION 2 -->
    <div class="question">
      <label>Would you be interested in our Breakfast service?</label>
      <div class="options">
        <label><input type="radio" name="breakfast" value="Yes" required><span>Yes</span></label>
        <label><input type="radio" name="breakfast" value="Maybe"><span>Maybe</span></label>
        <label><input type="radio" name="breakfast" value="No"><span>No</span></label>
      </div>
    </div>

    <!-- QUESTION 3 -->
    <div class="question">
      <label>Would you be interested in our Lunch service?</label>
      <div class="options">
        <label><input type="radio" name="lunch" value="Yes" required><span>Yes</span></label>
        <label><input type="radio" name="lunch" value="Maybe"><span>Maybe</span></label>
        <label><input type="radio" name="lunch" value="No"><span>No</span></label>
      </div>
    </div>

    <!-- QUESTION 4 -->
    <div class="question">
      <label>How spicy do you like your food?</label>
      <div class="options">
        <label><input type="radio" name="spice" value="Mild & Light" required><span>Mild & light</span></label>
        <label><input type="radio" name="spice" value="Medium"><span>Medium</span></label>
        <label><input type="radio" name="spice" value="Spicy"><span>Spicy 🌶</span></label>
        <label><input type="radio" name="spice" value="Extra Hot"><span>Extra Hot 🔥</span></label>
      </div>
    </div>

    <!-- QUESTION 5 -->
    <div class="question">
      <label>If we start a daily subscription, which plan would you like?</label>
      <div class="options">
        <label><input type="radio" name="subscription" value="Daily Meals" required><span>Daily Meals</span></label>
        <label><input type="radio" name="subscription" value="3 Days a Week"><span>3 Days a Week</span></label>
        <label><input type="radio" name="subscription" value="Weekly"><span>Weekly</span></label>
        <label><input type="radio" name="subscription" value="Occasional"><span>Occasional</span></label>
      </div>
    </div>

    <!-- QUESTION 6 -->
    <div class="question">
      <label>Would you like to add anything?</label>
      <div class="options">
        <label><input type="radio" name="addons" value="Fresh Juices & Shakes" required><span>Fresh Juices & Shakes</span></label>
        <label><input type="radio" name="addons" value="Evening Snacks"><span>Evening Snacks</span></label>
        <label><input type="radio" name="addons" value="Sweets / Desserts"><span>Sweets / Desserts</span></label>
        <label><input type="radio" name="addons" value="None"><span>None</span></label>
      </div>
    </div>

    <!-- QUESTION 7 -->
    <div class="question">
      <label>Any food item you’d love to have on our menu?</label>
      <textarea name="food-item" rows="3" required placeholder="Please type your answer..."></textarea>
    </div>

    <div class="btn-group">
      <button type="button" id="prevBtn" disabled>Previous</button>
      <button type="button" id="nextBtn" disabled>Next</button>
    </div>

  </form>
</div>

<script>
const questions = document.querySelectorAll(".question");
const progressText = document.getElementById("progress-text");
const progressBar = document.getElementById("progress-bar");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const form = document.getElementById("survey-form");

let currentStep = 0;

function updateProgress() {
  const percent = ((currentStep + 1) / questions.length) * 100;

  progressBar.style.width = percent + "%";
  progressText.innerText =
    `Question ${currentStep + 1} of ${questions.length}`;

  nextBtn.innerText =
    currentStep === questions.length - 1 ? "Submit" : "Next";

  prevBtn.disabled = currentStep === 0;
}

function validateStep() {
  const current = questions[currentStep];
  const requiredInputs = current.querySelectorAll("[required]");

  let valid = true;

  requiredInputs.forEach(input => {
    if (input.type === "radio") {
      if (!current.querySelector(
        `input[name="${input.name}"]:checked`
      )) {
        valid = false;
      }
    } else if (input.value.trim() === "") {
      valid = false;
    }
  });

  nextBtn.disabled = !valid;
}

updateProgress();
validateStep();

form.addEventListener("input", validateStep);
form.addEventListener("change", validateStep);

nextBtn.addEventListener("click", () => {
  if (currentStep < questions.length - 1) {

    questions[currentStep].classList.remove("active");

    currentStep++;

    questions[currentStep].classList.add("active");

    updateProgress();
    validateStep();

  } else {
    form.requestSubmit();
  }
});

prevBtn.addEventListener("click", () => {
  if (currentStep > 0) {

    questions[currentStep].classList.remove("active");

    currentStep--;

    questions[currentStep].classList.add("active");

    updateProgress();
    validateStep();
  }
});

form.addEventListener("submit", async e => {
  e.preventDefault();

  const loader = document.getElementById("loadingOverlay");

  loader.style.display = "flex";

  nextBtn.disabled = true;
  prevBtn.disabled = true;

  const formData = new FormData(form);

  try {

    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbzvj0_Cp1y9QLGd7MxmP5E29wh3-MuY0NhkAy9N8QxkNuZNtKmjq_Ei8PmI2aPraDGrtA/exec",
      {
        method: "POST",
        body: formData
      }
    );

    const result = await response.json();

    if (
      result.success &&
      result.offerCode &&
      result.offerCode !== "OFFER_CLOSED"
    ) {
      localStorage.setItem("offerCode", result.offerCode);
      localStorage.setItem("customerName", formData.get("name"));
    }

    window.location.href = "thankyou.html";

  } catch (err) {

    alert("Submission failed. Please try again.");

    loader.style.display = "none";

    nextBtn.disabled = false;
    prevBtn.disabled = false;

    console.error(err);
  }
});
</script>
</body>
</html>
